name: Check FB Lottery

on:
  schedule:
    # 設定定時執行：大約每 2 小時執行一次 (UTC 時間，可根據需求調整)
    - cron: '0 2-12/2 * * *' 
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install -r requirements.txt

      - name: 執行檢查程式
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python checker.py
